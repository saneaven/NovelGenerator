services:
  backend:
    environment:
      ASSET_STORAGE_BACKEND: "s3"
      UVICORN_RELOAD: "0"
    volumes:
      - assets_data:/app/App/backend/storage/assets

  usage-reconciler:
    environment:
      ASSET_STORAGE_BACKEND: "s3"
      STORAGE_USAGE_RECONCILER_ENABLED: "1"

  frontend:
    environment:
      FRONTEND_MODE: "prod"

  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./docker/certs-origin:/etc/caddy/certs:ro
