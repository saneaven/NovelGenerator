services:
  backend:
    environment:
      ASSET_STORAGE_BACKEND: "local"
      UVICORN_RELOAD: "1"
      WATCHFILES_FORCE_POLLING: "true"
      MEMRAY_ENABLED: "0"
    volumes:
      - ./App/backend:/app/App/backend
      - assets_data:/app/App/backend/storage/assets
      - ./memray_output:/app/memray_output

  usage-reconciler:
    environment:
      ASSET_STORAGE_BACKEND: "local"
    volumes:
      - ./App/backend:/app/App/backend

  frontend:
    environment:
      FRONTEND_MODE: "dev"
      CHOKIDAR_USEPOLLING: "true"
      VITE_ADMIN_MEMORY_DIAGNOSTICS_ENABLED: ${ADMIN_MEMORY_DIAGNOSTICS_ENABLED:-1}
    volumes:
      - ./App/frontend:/app/App/frontend
      - frontend_node_modules:/app/App/frontend/node_modules

  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
