services:
  sidecar:
    command: npm run dev
    volumes:
      - ./App/sidecar:/app
      - sidecar_node_modules:/app/node_modules

  backend:
    environment:
      UVICORN_RELOAD: "1"
      WATCHFILES_FORCE_POLLING: "true"
      SIDECAR_URL: "http://sidecar:3001"
    volumes:
      - ./App/backend:/app/App/backend
      - assets_data:/app/App/backend/storage/assets

  frontend:
    environment:
      FRONTEND_MODE: "dev"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./App/frontend:/app/App/frontend
      - frontend_node_modules:/app/App/frontend/node_modules

  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
