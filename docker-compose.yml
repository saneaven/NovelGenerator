services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.dev/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.dev/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.dev/.env.prod}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DB_USER: ${POSTGRES_USER:?set in .env.dev/.env.prod}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?set in .env.dev/.env.prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env.dev/.env.prod}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env.dev/.env.prod}
      DEMO_MODE_OPENROUTER_API_KEY: ${DEMO_MODE_OPENROUTER_API_KEY:?set in .env.dev/.env.prod}
      DEMO_MODE_OPENROUTER_MODEL: ${DEMO_MODE_OPENROUTER_MODEL:?set in .env.dev/.env.prod}
      DEMO_MODE_CONTEXT_WINDOW_TOKENS: ${DEMO_MODE_CONTEXT_WINDOW_TOKENS:-32000}
      DEMO_MODE_MAX_OUTPUT_TOKENS: ${DEMO_MODE_MAX_OUTPUT_TOKENS:-}
      DEMO_MODE_TEMPERATURE: ${DEMO_MODE_TEMPERATURE:-0.7}
      DEMO_MODE_THINKING_MODE: ${DEMO_MODE_THINKING_MODE:-off}
      DEMO_MODE_THINKING_EFFORT: ${DEMO_MODE_THINKING_EFFORT:-medium}
      APP_DOMAIN: ${APP_DOMAIN:-}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      LOCAL_ASSET_STORAGE_PATH: ${LOCAL_ASSET_STORAGE_PATH:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:?set in .env.dev/.env.prod}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    expose:
      - "8000"
    restart: unless-stopped

  usage-reconciler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    entrypoint: ["/app/docker/backend/reconciler_entrypoint.sh"]
    environment:
      DB_USER: ${POSTGRES_USER:?set in .env.dev/.env.prod}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?set in .env.dev/.env.prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env.dev/.env.prod}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env.dev/.env.prod}
      DEMO_MODE_OPENROUTER_API_KEY: ${DEMO_MODE_OPENROUTER_API_KEY:?set in .env.dev/.env.prod}
      DEMO_MODE_OPENROUTER_MODEL: ${DEMO_MODE_OPENROUTER_MODEL:?set in .env.dev/.env.prod}
      DEMO_MODE_CONTEXT_WINDOW_TOKENS: ${DEMO_MODE_CONTEXT_WINDOW_TOKENS:-32000}
      DEMO_MODE_MAX_OUTPUT_TOKENS: ${DEMO_MODE_MAX_OUTPUT_TOKENS:-}
      DEMO_MODE_TEMPERATURE: ${DEMO_MODE_TEMPERATURE:-0.7}
      DEMO_MODE_THINKING_MODE: ${DEMO_MODE_THINKING_MODE:-off}
      DEMO_MODE_THINKING_EFFORT: ${DEMO_MODE_THINKING_EFFORT:-medium}
      APP_DOMAIN: ${APP_DOMAIN:-}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-s3}
      LOCAL_ASSET_STORAGE_PATH: ${LOCAL_ASSET_STORAGE_PATH:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:?set in .env.dev/.env.prod}
      STORAGE_USAGE_RECONCILER_ENABLED: ${STORAGE_USAGE_RECONCILER_ENABLED:-1}
      STORAGE_USAGE_RECONCILER_INTERVAL_SECONDS: ${STORAGE_USAGE_RECONCILER_INTERVAL_SECONDS:-300}
      STORAGE_USAGE_RECONCILER_BATCH_SIZE: ${STORAGE_USAGE_RECONCILER_BATCH_SIZE:-100}
      STORAGE_USAGE_RECONCILER_STALE_AFTER_SECONDS: ${STORAGE_USAGE_RECONCILER_STALE_AFTER_SECONDS:-86400}
      STORAGE_USAGE_RECONCILER_ADVISORY_LOCK_KEY: ${STORAGE_USAGE_RECONCILER_ADVISORY_LOCK_KEY:-84512001}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      VITE_API_URL: ${VITE_API_URL}
    expose:
      - "5173"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  assets_data:
  caddy_data:
  caddy_config:
  frontend_node_modules:
