services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.dev/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.dev/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.dev/.env.prod}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  sidecar:
    build:
      context: ./App/sidecar
      dockerfile: Dockerfile
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DB_USER: ${POSTGRES_USER:?set in .env.dev/.env.prod}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?set in .env.dev/.env.prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env.dev/.env.prod}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env.dev/.env.prod}
      DEFAULT_ASSET_QUOTA_BYTES: ${DEFAULT_ASSET_QUOTA_BYTES:?set in .env.dev/.env.prod}
      SIDECAR_URL: http://sidecar:3001
    depends_on:
      db:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL}
    expose:
      - "5173"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  assets_data:
  caddy_data:
  caddy_config:
  frontend_node_modules:
  sidecar_node_modules:
